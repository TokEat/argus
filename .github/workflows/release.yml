name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.0'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: server-ui

      - name: Run CI checks
        run: make ci

  build:
    name: Build release artifacts
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server-ui/package-lock.json

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build bundle
        run: ./deploy/build-bundle.sh "${{ steps.version.outputs.version }}"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: argus-${{ steps.version.outputs.version }}-linux-amd64
          if-no-files-found: error
          path: deploy/argus-release-${{ steps.version.outputs.version }}-linux-amd64.tar.gz

      - name: Upload component artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-components-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            release/dddd-server-linux-amd64
            release/dddd-agent-linux-amd64
            server-ui/dist/**

  draft-release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/dddd-server-linux-amd64
            release-artifacts/**/dddd-agent-linux-amd64
