# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <title>WordPress &rsaquo; Installation</title>
          - Site Title
        case-insensitive: true
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/wp-admin/install.php'
id: wordpress-install
info:
  author: princechaddha
  description: |
    WordPress 存在安装文件暴露漏洞，攻击者可以通过访问安装文件来获取 WordPress 安装的详细信息。
    fofa: app="Wordpress"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: WordPress Exposed Installation
  severity: high
  tags: wordpress,install,expose,argus-import
