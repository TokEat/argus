# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - Dashboard
          - Jenkins
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/'
id: jenkins-dashboard-unauth
info:
  author: zan8in
  description: |-
    Jenkins Dashboard 未授权访问
    fofa: app="Jenkins"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Jenkins Dashboard 未授权访问
  severity: high
  tags: jenkins,unauth,argus-import
