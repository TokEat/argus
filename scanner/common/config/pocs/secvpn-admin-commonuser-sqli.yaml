# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"result":0'
          - '"msg":"username and password does not match!"'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/admin.php?controller=admin_commonuser'
id: secvpn-admin-commonuser-sqli
info:
  author: zan8in
  description: |-
    中远麒麟堡垒机能够提供细粒度的访问控制,最大限度保护用户资源的安全。麒麟堡垒机存在SQL注入漏洞漏洞
    FOFA: body="url=\"admin.php?controller=admin_index&action=get_user_login_fristauth&username="
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 中远麒麟堡垒机 SQL 注入
  severity: high
  tags: secvpn,sqli,argus-import
