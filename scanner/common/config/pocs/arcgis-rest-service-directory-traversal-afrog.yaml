# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'Folder: /'
          - ArcGIS REST Services Directory
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/arcgis/rest/services'
id: arcgis-rest-service-directory-traversal
info:
  author: zan8in
  description: |
    ArcGIS REST 服务目录为系统中所有的 ArcGIS Server Web 服务以及可通过 REST 执行的操作提供了一种基于 HTML 的可浏览的表现方式。ArcGIS REST 服务目录会暴露系统发布的服务，通过点Web界面上的链接可以获取到系统服务敏感数据。当不希望用户浏览系统中的服务列表、在 Web 搜索中查找系统中的服务或通过 HTML 表单请求系统中的服务时，建议在生产系统中禁用服务目录功能。
    fofa: title="ArcGIS"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: medium
  name: Arcgis REST 服务目录浏览
  severity: medium
  tags: arcgis,directorytraversal,argus-import
