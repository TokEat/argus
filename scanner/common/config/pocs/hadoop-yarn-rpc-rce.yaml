# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <application-id>
          - <memory>
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/ws/v1/cluster/apps/new-application'
id: hadoop-yarn-rpc-rce
info:
  author: zan8in
  description: ""
  metadata:
