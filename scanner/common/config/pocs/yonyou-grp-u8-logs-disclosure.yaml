# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - ' - [ INFO ]  write'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/logs/info.log'
id: yonyou-grp-u8-logs-disclosure
info:
  author: zan8in
  description: ""
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 用友 GRP-U8 管理平台 logs 敏感信息泄露
  severity: high
  tags: yonyou,logs,disclosure,argus-import
