# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: name=Admin&password=zabbix&autologin=1&enter=Sign+in
    matchers:
      - type: status
        status:
          - 302
      - type: word
        part: header
        words:
          - zabbix.php?action=dashboard.view
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/index.php'
id: zabbix-default-password
info:
  author: fuzz7j(https://github.com/fuzz7j)
  description: Zabbix default admin credentials were discovered.
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Zabbix Default Password
  severity: high
  tags: zabbix,default-login,argus-import
