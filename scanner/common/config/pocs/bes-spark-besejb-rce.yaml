id: bes-spark-besejb-rce

info:
  name: 宝蓝德 BES Spark BesEJB 反序列化漏洞
  author: dddd
  severity: critical
  description: |
    宝蓝德 BES (BES Application Server) Spark BesEJB 服务暴露面。当 /__bes/__ejb
    路径返回 200 且响应体为空时，可判定为 BES Spark BesEJB 服务暴露，
    攻击者可构造 EJB 调用请求触发服务端反序列化，进而执行任意命令。
    本模板仅做存在性确认。
  tags: bes,baolande,spark,ejb,deserialization,rce

http:
  - method: GET
    path:
      - "{{BaseURL}}/__bes/__ejb"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && len(body) == 0'
