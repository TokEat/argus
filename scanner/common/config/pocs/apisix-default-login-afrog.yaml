# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      {"username":"admin","password":"admin"}
    headers:
      Content-Type: application/json;charset=UTF-8
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"data"'
          - '"token"'
          - '"code":0'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/apisix/admin/user/login'
id: apisix-default-login
info:
  author: pdteam
  description: |-
    An Apache Apisix default admin login was discovered.
    shodan: title:"Apache APISIX Dashboard"
    fofa: title="Apache APISIX Dashboard"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Apache Apisix Default Admin Login
  severity: high
  tags: apisix,apache,default-login,argus-import
