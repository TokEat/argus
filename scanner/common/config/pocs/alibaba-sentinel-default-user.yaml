# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - headers:
      Authorization: Basic Og==
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"success":true'
          - '"code":0'
          - '"msg":"success"'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/auth/login?password=sentinel&username=sentinel'
id: alibaba-sentinel-default-user
info:
  author: zan8in
  description: 'fofa: app="Sentinel-Dashboard"'
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Alibaba Sentinel 默认用户
  severity: high
  tags: alibaba,sentinel,default-user,argus-import
