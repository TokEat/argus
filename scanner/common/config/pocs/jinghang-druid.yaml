id: jinghang-druid
info:
  name: jinghang-druid
  author: changge
  severity: high

http:
  - raw:
      - |
        GET //tqas/druid/index.html HTTP/1.1
        Host: {{Hostname}}
        Pragma: no-cache
        Upgrade-Insectre-Requests: 1
        Connection: close
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avifimage/webp,image/apng,*/*;q=0.8,application/signed-exchangev=b3;q=0.9
        Accept-Encoding: gzip, deflate
        Cache-Control: no-cache
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Accept-Language: zh-CN,zh;g=0.9

    matchers:
      - type: dsl
        dsl:
          - status_code_1==200  && contains_all(body_2,"Java")
