# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <web-app
          - </web-app>
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/WEB-INF/web.xml'
id: web-inf-web-xml-disclosure
info:
  author: zan8in
  description: |
    WEB-INF目录下的web.xml文件包含了应用程序的配置信息，包括Servlet、Filter、Listener等组件的配置。
    攻击者可以通过访问该文件获取应用程序的配置信息，从而导致信息泄露。
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: WEB-INF Disclosure
  severity: high
  tags: web-inf,webxml,disclosure,argus-import
