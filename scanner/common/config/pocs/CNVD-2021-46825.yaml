# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '{"totalMem":'
          - '"stormVersion":'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/api/v1/cluster/summary'
id: CNVD-2021-46825
info:
  author: wulalalaaa
  description: Apache storm存在未经授权的访问漏洞，攻击者可利用该漏洞未授权访问，从而获取敏感信息及进行未授权操作等。
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Apache storm未经授权的访问
  severity: critical
  tags: cnvd,cnvd2021,unauth,storm,argus-import
