# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - HiveServer
          - Active Sessions
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/'
id: hiveserver-unauth
info:
  author: zan8in
  description: |-
    HiveServer 未授权访问
    fofa: app="HiveServer"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: HiveServer 未授权访问
  severity: high
  tags: hiveserver,unauth,argus-import
