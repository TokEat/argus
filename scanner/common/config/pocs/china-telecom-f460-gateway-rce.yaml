# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'please input shell command:'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/web_shell_cmd.gch'
id: china-telecom-f460-gateway-rce
info:
  author: jijue
  description: |-
    2014 年 3 月 3 日，Rapid7 团队发布了中兴 F460 / F660 后门信息[1]，
    任何可以访问设备的用户都可以直接访问一个命令执行的 Web 界面，并以 root 权限执行任意命令。
    经过验证，此漏洞不止存在于 Rapid7 公开的两个型号（ F460 / F660 ）的设备中，
    其他型号也存在此问题（主要有 F412、F420、F460、F660、ZXA10F460 等）。
    且描述中的两个型号也不一定存在此漏洞，可能与电信装机时的配置有关
    fofa: title="F460"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 电信天翼网关 F460 web_shell_cmd.gch 远程命令执行漏洞
  severity: critical
  tags: telecom,f460,rce,argus-import
