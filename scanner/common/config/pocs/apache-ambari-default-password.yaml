# 来源: xray（转换自 afrog/xray 表达式 POC）
http:
  - headers:
      Authorization: Basic YWRtaW46YWRtaW4=
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - PrivilegeInfo
          - AMBARI.ADMINISTRATOR
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/api/v1/users/admin?fields=*,privileges/PrivilegeInfo/cluster_name,privileges/PrivilegeInfo/permission_name'
id: apache-ambari-default-password
info:
  author: wulalalaaa(https://github.com/wulalalaaa)
  description: ""
  metadata:
    argus-execution-class: detection
    argus-import-license: 在符合以下条件的情况下，我们欢迎任何人以任何形式使用本项目（包括商用）。
    argus-import-source: xray
    argus-risk-level: medium
  name: apache-ambari-default-password
  reference:
    - https://cwiki.apache.org/confluence/display/AMBARI/Quick+Start+Guide
  severity: medium
  tags: argus-import
