# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: username=admin&password=admin
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"statusCode":200'
          - '"msgDesc":"Login Successful"'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/login'
id: ranger-default-login
info:
  author: For3stCo1d
  description: |
    Apache Ranger contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations.
    shodan: http.title:"Ranger - Sign In"
    fofa: title="Ranger - Sign In"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Apache Ranger - Default Login
  severity: high
  tags: apache,ranger,default-login,argus-import
