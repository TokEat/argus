# 来源: xray（转换自 afrog/xray 表达式 POC）
http:
  - body: name=Admin&password=zabbix&autologin=1&enter=Sign+in
    matchers:
      - type: status
        status:
          - 302
      - type: word
        part: header
        words:
          - zabbix.php?action=dashboard.view
          - zbx_session
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/index.php'
id: zabbix-default-password
info:
  author: fuzz7j(https://github.com/fuzz7j)
  description: ""
  metadata:
    argus-execution-class: detection
    argus-import-license: 在符合以下条件的情况下，我们欢迎任何人以任何形式使用本项目（包括商用）。
    argus-import-source: xray
    argus-risk-level: medium
  name: zabbix-default-password
  reference:
    - https://www.zabbix.com/documentation/3.4/zh/manual/quickstart/login
  severity: medium
  tags: argus-import
