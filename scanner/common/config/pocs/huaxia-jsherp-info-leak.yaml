          - 200
      - type: word
        part: body
        words:
          - '"code":'
          - '"data":'
          - '"userList":'
          - '"username":'
          - '"password":'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/jshERP-boot/user/getAllList;.ico'
