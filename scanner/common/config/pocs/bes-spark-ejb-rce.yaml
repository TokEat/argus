id: bes-spark-ejb-rce

info:
  name: 宝蓝德 BES Spark EJB 反序列化漏洞
  author: dddd
  severity: critical
  description: |
    宝蓝德 BES (BES Application Server) Spark EJB 服务暴露面。当 /BesEJB/spark
    路径返回 200 且响应体含 "Spark" 字样时，可判定为 BES Spark EJB 服务暴露，
    攻击者可构造 EJB 调用请求触发服务端反序列化，进而执行任意命令。
    本模板仅做存在性确认。
  tags: bes,baolande,spark,ejb,deserialization,rce

http:
  - method: GET
    path:
      - "{{BaseURL}}/BesEJB/spark"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 500 && contains(body, "Spark expects a POST")'
