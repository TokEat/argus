id: jolokia-createstandardhost-rce

info:
  name: Jolokia createStandardHost 远程代码执行
  author: laluka,pathtaga,idealphase
  severity: critical
  description: 未授权 Jolokia/Actuator Jolokia 暴露 MBeanFactory/createStandardHost 与 DiagnosticCommand 时，可用于写文件并导致远程代码执行。
  reference:
    - https://github.com/laluka/jolokia-exploitation-toolkit
  classification:
    cwe-id: CWE-15,CWE-94
  tags: jolokia,rce,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/jolokia/list"
      - "{{BaseURL}}/actuator/jolokia/list"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "\"desc\":\"Create a new StandardHost\""
          - "\"desc\":\"Array of Diagnostic Commands Arguments and Options\""
        condition: and

      - type: status
        status:
          - 200
