# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: username=admin&password=admin
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - var time=0;
          - var leftPwdNums=0;
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/action/login'
id: utt-default-password
info:
  author: zan8in
  description: app="UTT-安全网络管理系统"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: utt-default-password
  severity: high
  tags: utt,default-login,argus-import
