# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: more=0&host=0&username=admin&password=admin&db=&lang=zh_cn&expire=3
    matchers:
      - type: status
        status:
          - 302
      - type: word
        part: header
        words:
          - /index.php?action=admin.index&host=0
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/index.php?action=login.index&host=0'
id: rockmongo-default-password
info:
  author: B1anda0
  description: app="RockMongo"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Rockmongo Default Password
  severity: high
  tags: rockmongo,default-password,argus-import
