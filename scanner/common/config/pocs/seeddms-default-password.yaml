# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: login=admin&pwd=admin&lang=
    matchers:
      - type: status
        status:
          - 302
      - type: word
        part: header
        words:
          - /out/out.ViewFolder.php
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/op/op.Login.php'
id: seeddms-default-password
info:
  author: alifathi-h1
  description: app="SeedDMS:-Sign-in"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: SeedDMS Default Credential
  severity: high
  tags: default-login,seeddms,argus-import
