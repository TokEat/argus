id: sangfor-mig-login-panel

info:
  name: 深信服一体化网关 MIG 管理登录接口
  author: ehole
  severity: info
  description: |
    深信服一体化网关 MIG 管理入口 /cgi-bin/login.cgi 对外暴露，页面同时包含 /html/wz_tooltip.js。路径与关键字来自 EHole / xray-plugins ehole「深信服一体化网关 MIG」以及 Argus dir.yaml，仅识别管理路径，不发送命令执行载荷。不等于 NGAF login.cgi RCE。
  reference:
    - https://github.com/EdgeSecurityTeam/EHole
    - https://github.com/chaitin/xray-plugins
  metadata:
    max-request: 1
    fofa-query: body="cgi-bin/login.cgi" && body="/html/wz_tooltip.js"
    verified: true
  tags: sangfor,mig,panel,info

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/login.cgi"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "/html/wz_tooltip.js"
          - "login.cgi"
        condition: and

      - type: status
        status:
          - 200
