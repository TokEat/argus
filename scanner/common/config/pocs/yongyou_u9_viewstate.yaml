id: yongyou_u9_viewstate

info:
  name: msk-template
  author: msk
  severity: info


http:
  - raw:
      - |
        GET /Print/PDFDirectPrint.aspx HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/javascript, */*; q=0.01
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        Cookie: JSESSIONID=A38731F543E167FAF1E74D7BF4EB7A0A
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36


    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && contains((body_1), '__VIEWSTATEGENERATOR')"