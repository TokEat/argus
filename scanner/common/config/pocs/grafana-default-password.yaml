# 来源: xray（转换自 afrog/xray 表达式 POC）
http:
  - body: '{"user":"admin","password":"admin"}'
    headers:
      Content-Type: application/json
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"message":"Logged in"'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/login'
id: grafana-default-password
