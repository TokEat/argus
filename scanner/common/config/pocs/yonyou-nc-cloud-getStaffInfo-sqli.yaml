id: yonyou-nc-cloud-getStaffInfo-sqli

info:
  name: 用友 NC Cloud getStaffInfo SQL 注入
  author: ZacharyZcR
  severity: critical
  description: |
    用友 NC Cloud attendstaff/getStaffInfo 接口 id 参数存在 SQL 注入，可执行任意 SQL。
  reference:
    - https://github.com/wy876/POC
  metadata:
    max-request: 1
    fofa-query: app="用友-NC-Cloud"
  tags: yonyou,nccloud,sqli

http:
