# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      Username=user&Password=MDRmODk5NmRhNzYzYjdhOTY5YjEwMjhlZTMwMDc1NjllYWYzYTYzNTQ4NmRkYWIyMTFkNTEyYzg1YjlkZjhmYg%3D%3D
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <title>replace</title>
        case-insensitive: true
        condition: and
      - type: word
        part: header
        words:
          - SessionID
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/index/login.cgi'
id: huawei-hg532e-default-login
