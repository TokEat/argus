# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      action=login&u=admin&p=admin256
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"auth":'
          - '"success": true'
        condition: and
      - type: word
        part: header
        words:
          - application/json
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/service.web'
id: exacqvision-default-login
info:
  author: ELSFA7110
  description: |-
    ExacqVision Web Service default login credentials (admin/admin256) were discovered.
    fofa: ExacqVision
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: ExacqVision Default Login
  severity: high
  tags: exacqvision,default-login,argus-import
