# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - UserName=
          - Password=
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/hosts'
id: kyan-network-monitoring-account-password-leakage
info:
  author: B1anda0
  description: |-
    Kyan 网络监控设备 存在账号密码泄露漏洞，攻击者通过漏洞可以获得账号密码和后台权限
    fofa: title="platform - Login"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Kyan 网络监控设备 hosts 账号密码泄露漏洞
  severity: high
  tags: kyan,disclosure,argus-import
