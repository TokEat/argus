# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: '{"username":"admin","password":"123456"}'
    headers:
      Content-Type: application/json
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '{"code":20000,'
          - '"data":{"token"'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/api/v1/user/login'
id: alibaba-canal-default-password
info:
  author: jweny
  description: |-
    An Alibaba Canal default login was discovered.
    fofa: title="Canal Admin"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Alibaba Canal Default Password
  severity: high
  tags: alibaba,default-login,argus-import
