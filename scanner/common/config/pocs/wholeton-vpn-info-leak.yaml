# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - administrator
          - virtualadapter
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/backup/config.xml'
id: wholeton-vpn-info-leak
info:
