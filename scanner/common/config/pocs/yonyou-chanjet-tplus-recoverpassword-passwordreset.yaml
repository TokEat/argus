# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"pwdNew":pwdNew'
          - _RecoverPassword_class
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/tplus/ajaxpro/RecoverPassword,App_Web_recoverpassword.aspx.cdcab7d2.ashx'
id: yonyou-chanjet-tplus-recoverpassword-passwordreset
info:
  author: zan8in
  description: |
    用友 畅捷通T+ RecoverPassword.aspx 存在未授权管理员密码修改漏洞，攻击者可以通过漏洞修改管理员账号密码登录后台
    fofa: app="畅捷通-TPlus"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 用友 畅捷通T+ RecoverPassword.aspx 管理员密码修改漏洞
  severity: high
  tags: yonyou,chanjet,tplus,passwordreset,argus-import
