id: jumpserver-chen-fastjson

info:
  name: JumpServer Chen Fastjson 未摘除识别 (CVE-2026-16723)
  author: argus
  severity: high
  description: |
    JS-2026.7.29 / CVE-2026-16723。只钉 V4 未补（4.10.16）：
    WS 握手打到解析口，页面 title 是 Chen 且无 window.__CHEN_BASE__，
    且 /chen/healthy 返回纯文本 ok。
    V3（3.10.21/3.10.22）无 /chen/healthy，HTTP 分不出补丁，本条不报。
    V4 已补（4.10.17）HTML 有 __CHEN_BASE__，本条不报。
    不发 WS 业务帧，不写 @type/autoType/gadget，不用 /chen/api/auth 信封。
  reference:
    - https://www.jumpserver.org/blog/security-20260729.html
    - https://github.com/jumpserver/chen
  metadata:
    max-request: 3
    product: FIT2CLOUD-JumpServer堡垒机
    cve: CVE-2026-16723
    advisory: JS-2026.7.29
    fofa-query: app="FIT2CLOUD-JumpServer-堡垒机"
  tags: jumpserver,chen,fastjson,websocket,cve-2026-16723,js-2026-7-29

http:
  - raw:
      - |
        GET /chen/ws/console HTTP/1.1
        Host: {{Hostname}}
        Upgrade: websocket
        Connection: Upgrade
        Sec-WebSocket-Version: 13
        Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
        Sec-WebSocket-Protocol: argusfp
        Origin: http://{{Hostname}}

      - |
        GET /chen/ HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /chen/healthy HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 101 && contains(to_lower(header_1), "upgrade: websocket")'
          - 'status_code_2 == 200 && contains(body_2, "Chen: JumpServer Web Database") && !contains(body_2, "__CHEN_BASE__")'
          - 'status_code_3 == 200 && contains(body_3, "ok") && !contains(body_3, "<") && !contains(body_3, "{")'
        condition: and
