# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"code":20000'
          - '"name":"canal.properties"'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/api/v1/canal/config/1/0'
id: alibaba-canal-config-leak
info:
  author: zan8in
  description: |-
    由于/api/v1/canal/config 未进行权限验证可直接访问，导致账户密码、accessKey、secretKey等一系列敏感信息泄露
    fofa: title="Canal Admin"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Alibaba Canal config 云密钥信息泄露漏洞
  severity: high
  tags: canal,sqli,argus-import
