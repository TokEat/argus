# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      {"username":"admin","password":"arlpass"}
    headers:
      Content-Type: application/json; charset=UTF-8
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"message": "success"'
          - '"username": "admin"'
          - '"type": "login"'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/api/user/login'
id: arl-default-password
info:
  author: pikpikcu
  description: An ARL default admin login was discovered.
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: ARL Default Admin Login
  severity: high
  tags: arl,default-login,argus-import
