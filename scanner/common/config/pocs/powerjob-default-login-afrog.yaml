# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      {"appName":"powerjob-worker-samples","password":"powerjob123"}
    headers:
      Content-Type: application/json
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '{"success":true,"data":'
        condition: and
      - type: word
        part: header
        words:
          - application/json
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/appInfo/assert'
id: powerjob-default-login
info:
  author: j4vaovo
  description: |-
    PowerJob default login credentials were discovered.
    shodan: http.title:"PowerJob"
    fofa: title="PowerJob"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: PowerJob - Default Login
  severity: high
  tags: powerjob,default-login,argus-import
