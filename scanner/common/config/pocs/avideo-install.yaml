# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <title>Install AVideo</title>
        case-insensitive: true
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/install/index.php'
id: avideo-install
info:
  author: ritikchaddha
  description: |-
    AVideo installer panel was detected.
    shodan: http.title:"AVideo"
    fofa: "AVideo"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: AVideo Installer - Detect
  severity: high
  tags: panel,install,avideo,argus-import
