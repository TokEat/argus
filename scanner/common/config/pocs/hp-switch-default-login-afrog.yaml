# 来源: afrog（转换自 afrog/xray 表达式 POC）
http:
  - body: username=admin&password=
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"redirect": "/htdocs/pages/main/main.lsp"'
          - '"error": ""'
        condition: and
    method: POST
    path:
      - '{{BaseURL}}/htdocs/login/login.lua'
id: hp-switch-default-login
info:
  author: pussycat0x
  description: |-
    HP 1820-8G Switch J9979A default admin login credentials were discovered.
    fofa: HP 1820-8G Switch J9979A
  metadata:
    argus-execution-class: detection
    argus-import-license: MIT License
    argus-import-source: afrog
    argus-risk-level: high
  name: HP 1820-8G Switch J9979A Default Login
  severity: high
  tags: default-login,hp,argus-import
